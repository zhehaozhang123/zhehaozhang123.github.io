<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: page.summary | escape }}">
  <meta name="author" content="{{ page.authors | join: ', ' | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: page.summary | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.image | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@Zhehao_Zhang123">
  <meta name="twitter:title" content="{{ page.title | escape }}">
  <meta name="twitter:description" content="{{ page.description | default: page.summary | escape }}">
  <meta name="twitter:image" content="{{ page.image | absolute_url }}">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/icons/favicon-32x32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/icons/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/blog/video-cut-bench/article.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/blog/video-cut-bench/performance.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/blog/video-cut-bench/evidence.css' | relative_url }}">
  <noscript><style>[data-vcb-figure],#vcb-theme{display:none!important}</style></noscript>
  {% feed_meta %}
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","headline":{{ page.title | jsonify }},"description":{{ page.description | default: page.summary | jsonify }},"datePublished":{{ page.date | date_to_xmlschema | jsonify }},"url":{{ page.url | absolute_url | jsonify }},"image":{{ page.image | absolute_url | jsonify }},"author":[{% for author in page.authors %}{"@type":"Person","name":{{ author | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]}</script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YMVTT71WC1"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-YMVTT71WC1');</script>
</head>
